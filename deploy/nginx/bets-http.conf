# Matched betting behind https://example.com/bets/ - http{} context.
# Installed as /etc/nginx/conf.d/20-matched-betting.conf (tracked in the matched-betting repo, deploy/nginx/).
# Keys are the visitor IP ($remote_addr from CF-Connecting-IP, conf.d/00-hardening.conf); requests made
# on the Pi itself ($private_app_ok = 1, conf.d/10-site.conf) are not counted.
map $private_app_ok $bets_key {
    1       "";
    default $binary_remote_addr;
}
map $request_method $bets_read_key {
    default "";
    GET     $bets_key;
    HEAD    $bets_key;
}
map $request_method $bets_write_key {
    default $bets_key;
    GET     "";
    HEAD    "";
}
map $request_method $bets_method_ok {
    default 0;
    GET     1;
    HEAD    1;
    POST    1;
}
# Reads: pages, figures, exports. Writes: forms and the import API. Login: guessing protection
# (the app also limits failures per IP and overall).
limit_req_zone  $bets_read_key  zone=bets_read:1m  rate=10r/s;
limit_req_zone  $bets_write_key zone=bets_write:1m rate=30r/m;
limit_req_zone  $bets_write_key zone=bets_login:1m rate=6r/m;
limit_conn_zone $bets_key       zone=bets_conn:1m;

# ChatGPT plugin (Matched Betting Assistant MCP, 127.0.0.1:8762): one person's assistant, so tight.
limit_req_zone  $bets_key zone=bets_mcp:1m   rate=60r/m;
limit_req_zone  $bets_key zone=bets_oauth:1m rate=12r/m;
# The MCP service sets its own CSP (the consent page must allow posting back to chatgpt.com);
# nginx supplies a strict default when the response has none (e.g. its own 405/429).
map $upstream_http_content_security_policy $bets_mcp_csp {
    ""      "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    default $upstream_http_content_security_policy;
}
