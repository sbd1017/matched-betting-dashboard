# Proxy settings for each /bets location. Installed as /etc/nginx/snippets/matched-betting-proxy.conf.
# Authorization is set per location: cleared everywhere except the Assistant Intake API.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;                     # the app checks Origin against https://example.com
proxy_set_header X-Real-IP $remote_addr;         # visitor IP for the app's login limiter
proxy_set_header X-Forwarded-For $remote_addr;   # never the client's own header
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_redirect off;                              # the app only emits /bets/... redirects
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
include snippets/matched-betting-headers.conf;
