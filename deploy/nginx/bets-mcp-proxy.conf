# Proxy settings for the ChatGPT plugin (MCP) locations. Installed as /etc/nginx/snippets/matched-betting-mcp-proxy.conf.
# The bearer token (Authorization) is passed only here and to /bets/api/assistant/; never logged.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;                     # the MCP server only accepts example.com (DNS-rebinding guard)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header Authorization $http_authorization;
proxy_redirect off;
proxy_buffering off;
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
add_header Content-Security-Policy $bets_mcp_csp always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Cache-Control "no-store" always;
