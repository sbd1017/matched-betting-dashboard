# Matched betting behind https://example.com/bets/ - server{} context of example.com.
# Installed as /etc/nginx/snippets/matched-betting.conf (tracked in the matched-betting repo, deploy/nginx/).
#
# Cloudflare -> cloudflared -> nginx 127.0.0.1:8081 -> here -> app 127.0.0.1:8760 (path kept: /bets/...).
# The app has its OWN login (not the shared private-apps Basic Auth), CSRF + same-origin checks,
# and sends its own security headers; nginx adds rate limits and covers its own error responses.
# /bets/api/assistant/ instead takes the Assistant Intake bearer token (candidates only).

location = /bets {
    access_log /var/log/nginx/example.com.access.log;
    access_log /var/log/nginx/matched-betting.access.log apps_log;
    include snippets/matched-betting-headers.conf;
    return 308 /bets/$is_args$args;
}

location ^~ /bets/ {
    if ($bets_method_ok = 0) { return 405; }
    access_log /var/log/nginx/example.com.access.log;
    access_log /var/log/nginx/matched-betting.access.log apps_log;
    limit_conn bets_conn 20;
    limit_conn_status 429;
    limit_req zone=bets_read burst=60 nodelay;
    limit_req zone=bets_write burst=15 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    proxy_pass http://127.0.0.1:8760;
    include snippets/matched-betting-proxy.conf;
    proxy_set_header Authorization "";

    location = /bets/login {
        if ($bets_method_ok = 0) { return 405; }
        limit_req zone=bets_read burst=60 nodelay;
        limit_req zone=bets_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8760;
        include snippets/matched-betting-proxy.conf;
        proxy_set_header Authorization "";
    }
    # Assistant Intake (ChatGPT): the only /bets path where a bearer token reaches the app.
    # The token can submit candidates and nothing else (bets/assistant.py); no session/cookies here.
    location ^~ /bets/api/assistant/ {
        if ($bets_method_ok = 0) { return 405; }
        limit_req zone=bets_read burst=30 nodelay;
        limit_req zone=bets_write burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8760;
        include snippets/matched-betting-proxy.conf;
        proxy_set_header Authorization $http_authorization;
    }
    location = /bets/healthz { return 404; }   # local monitoring only
}

# ---------------------------------------------------------------------------------------------
# ChatGPT plugin "Matched Betting Assistant" (MCP, bets_mcp on 127.0.0.1:8762). OAuth with its own
# credentials; the tools can only submit candidates that the user confirms in /bets/imports.
# Logged with the path-only format (never query strings or headers).

# The MCP endpoint (Streamable HTTP, stateless JSON). POST only in practice; GET/DELETE answer 405.
location = /bets/mcp {
    if ($bets_method_ok = 0) { return 405; }
    access_log /var/log/nginx/matched-betting.access.log apps_log;
    limit_req zone=bets_mcp burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    proxy_pass http://127.0.0.1:8762;
    include snippets/matched-betting-mcp-proxy.conf;
}
# OAuth (authorize, consent, token, register, revoke) and issuer-relative metadata.
location ^~ /bets/mcp/ {
    if ($bets_method_ok = 0) { return 405; }
    access_log /var/log/nginx/matched-betting.access.log apps_log;
    limit_req zone=bets_oauth burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    rewrite ^/bets/mcp(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8762;
    include snippets/matched-betting-mcp-proxy.conf;
}
# OAuth discovery documents at the RFC 9728 / RFC 8414 well-known locations (exact paths only).
location = /.well-known/oauth-protected-resource/bets/mcp {
    access_log /var/log/nginx/matched-betting.access.log apps_log;
    limit_req zone=bets_oauth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8762;
    include snippets/matched-betting-mcp-proxy.conf;
}
location = /.well-known/oauth-authorization-server/bets/mcp {
    access_log /var/log/nginx/matched-betting.access.log apps_log;
    limit_req zone=bets_oauth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8762/.well-known/oauth-authorization-server;
    include snippets/matched-betting-mcp-proxy.conf;
}
